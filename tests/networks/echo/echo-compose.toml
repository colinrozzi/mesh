# Compose the full RSM actor: mesh-system (entry) ⊕ mesh node ⊕ echo-SM.
#   system → node  : the `node` interface (node.pact) — the system owns host I/O.
#   node   → SM    : the `state-machine` interface (Interface 1) — the fold hot path.
# Compose with the official packr 0.13.0 (~/.cargo/bin/packr). Paths relative to this dir.

[[component]]
name  = "mesh-system"
wasm  = "../../../mesh-system/target/wasm32-unknown-unknown/release/mesh_system.wasm"
entry = true

[[component]]
name = "mesh"
wasm = "../../../target/wasm32-unknown-unknown/release/mesh.wasm"

[[component]]
name = "echo-sm"
wasm = "echo-sm/target/wasm32-unknown-unknown/release/echo_sm.wasm"

# ---- system → node (node.pact) ----
[[link]]
consumer = "mesh-system"
import   = "node.init"
provider = "mesh"
export   = "init"

[[link]]
consumer = "mesh-system"
import   = "node.resume"
provider = "mesh"
export   = "resume"

[[link]]
consumer = "mesh-system"
import   = "node.on-connect"
provider = "mesh"
export   = "on-connect"

[[link]]
consumer = "mesh-system"
import   = "node.on-bytes"
provider = "mesh"
export   = "on-bytes"

[[link]]
consumer = "mesh-system"
import   = "node.on-close"
provider = "mesh"
export   = "on-close"

[[link]]
consumer = "mesh-system"
import   = "node.tick"
provider = "mesh"
export   = "tick"

[[link]]
consumer = "mesh-system"
import   = "node.author"
provider = "mesh"
export   = "author"

[[link]]
consumer = "mesh-system"
import   = "node.subscribe"
provider = "mesh"
export   = "subscribe"

[[link]]
consumer = "mesh-system"
import   = "node.current-state"
provider = "mesh"
export   = "current-state"

[[link]]
consumer = "mesh-system"
import   = "node.current-members"
provider = "mesh"
export   = "current-members"

[[link]]
consumer = "mesh-system"
import   = "node.event-status"
provider = "mesh"
export   = "event-status"

# ---- node → SM (state-machine / Interface 1) ----
[[link]]
consumer = "mesh"
import   = "state-machine.initial-state"
provider = "echo-sm"
export   = "initial-state"

[[link]]
consumer = "mesh"
import   = "state-machine.validate"
provider = "echo-sm"
export   = "validate"

[[link]]
consumer = "mesh"
import   = "state-machine.apply"
provider = "echo-sm"
export   = "apply"

[[link]]
consumer = "mesh"
import   = "state-machine.members"
provider = "echo-sm"
export   = "members"
