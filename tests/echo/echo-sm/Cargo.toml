[package]
name = "echo-sm"
version = "0.1.0"
edition = "2021"
description = "Tier-2 reference state-machine: a request/response (echo) journal (DESIGN-rsm.md Interface 1). A Response is valid iff its ancestry holds the Request it names — ancestry-relative validity, conflict-free under a single responder. control-sm stripped to the bare request/response pattern; imports echo-protocol."

[lib]
crate-type = ["cdylib"]

[dependencies]
packr-guest = "0.13.0"
echo-protocol = { path = "../echo-protocol" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
