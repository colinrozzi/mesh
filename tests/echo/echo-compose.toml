# Compose the node (entry) with echo-sm → the tier-2 request/response node artifact.
# Compose with the FIXED packr (/home/colin/work/pack/target/release/packr … --output …).

[[component]]
name  = "mesh"
wasm  = "../../target/wasm32-unknown-unknown/release/mesh.wasm"
entry = true

[[component]]
name = "echo-sm"
wasm = "echo-sm/target/wasm32-unknown-unknown/release/echo_sm.wasm"

[[link]]
consumer = "mesh"
import   = "state-machine.initial-state"
provider = "echo-sm"
export   = "initial-state"

[[link]]
consumer = "mesh"
import   = "state-machine.validate"
provider = "echo-sm"
export   = "validate"

[[link]]
consumer = "mesh"
import   = "state-machine.apply"
provider = "echo-sm"
export   = "apply"
