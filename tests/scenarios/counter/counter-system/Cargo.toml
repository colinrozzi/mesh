[package]
name = "counter-system"
version = "0.1.0"
edition = "2021"
description = "Reference RSM executor (the 'system'): a theater actor that supervises its own counter node and drives it — TAKES ACTION over theater RPC (author + read verbs) and WATCHES EVENTS over the message-server finalized stream. The app-logic layer of the executor / protocol / SM / node stack;"

[lib]
crate-type = ["cdylib"]

[dependencies]
packr-guest = { version = "0.15", features = ["derive"] }
mesh-client = { path = "../../../../mesh-client" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
