[package]
name = "cluster-system"
version = "0.1.0"
edition = "2021"
description = "Tier-3 reference: a cluster ORCHESTRATOR + OBSERVER. One theater actor that supervisor-spawns N counter nodes (wired to gossip), drives a workload of increments across them over RPC, subscribes to every node's finalized stream, and polls current-state across the cluster to track a live network view until it converges. Reuses the counter SM."

[lib]
crate-type = ["cdylib"]

[dependencies]
packr-guest = { version = "0.24", features = ["derive"] }
mesh-client = { path = "../../../../mesh-client" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
