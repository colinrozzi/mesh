[package]
name = "mesh-system"
version = "0.1.0"
edition = "2021"
description = "The generic mesh system entry actor: owns ALL host I/O (tcp/timer/message-server) and drives a composed pure `node` component (node.pact) — the entry half of the `system ⊕ node ⊕ SM` composite (DESIGN-dx.md). It shuttles bytes to the node and performs the effects the node returns, injecting wall-clock time where events are signed. Keeps the RPC + finalized-stream surfaces executors drive (retired in M6)."

[lib]
crate-type = ["cdylib"]

[dependencies]
packr-guest = { version = "0.24", features = ["derive"] }
packr-abi = { version = "0.24", default-features = false }
theater-guest = { git = "https://github.com/colinrozzi/theater", rev = "00b0bf93fe69a231463d3ba918fa435c5f2a517d" }

[profile.release]
opt-level = "s"
lto = true
