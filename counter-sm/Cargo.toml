[package]
name = "counter-sm"
version = "0.1.0"
edition = "2021"
description = "Reference RSM state-machine component: a replicated counter (DESIGN-rsm.md Interface 1). Pure/confluent/structure-blind validate+apply over counter-protocol kinds; Inc is commutative so it is admission-final (conflict-free). The SM layer of the reference stack; imports counter-protocol for the codec."

[lib]
crate-type = ["cdylib"]

[dependencies]
packr-guest = "0.12.7"
counter-protocol = { path = "../counter-protocol" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
