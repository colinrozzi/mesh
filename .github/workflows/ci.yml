name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm target + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The crate is #![no_std] for wasm, so clippy/build must use the wasm
      # target (a host build would pull in std and conflict with the guest
      # panic handler). Unit tests run on the host under cfg(test), where std
      # is available.
      - name: Clippy
        run: |
          cargo clippy --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --target wasm32-unknown-unknown --manifest-path example-app/Cargo.toml -- -D warnings
          cargo clippy --target wasm32-unknown-unknown --manifest-path mesh-client-pkg/Cargo.toml -- -D warnings

      - name: Build (wasm release)
        run: |
          cargo build --release --target wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown --manifest-path example-app/Cargo.toml
          # The composable client package + the compose-smoke entry fixture.
          cargo build --release --target wasm32-unknown-unknown --manifest-path mesh-client-pkg/Cargo.toml
          cargo build --release --target wasm32-unknown-unknown --manifest-path compose-smoke/sentinel-stub/Cargo.toml

      - name: Unit tests
        run: |
          cargo test --lib
          cargo test --manifest-path mesh-api/Cargo.toml
          cargo test --manifest-path mesh-client/Cargo.toml

      # Compile the integration-test clients so they don't bit-rot. They aren't
      # *run* in CI — they spawn the `theater` runtime, which isn't available on
      # a hosted runner. Run them locally (see README).
      - name: Compile test clients
        run: |
          cargo build --manifest-path testkit/Cargo.toml
          cargo build --manifest-path smoke/Cargo.toml
          cargo build --manifest-path multi-node-test/Cargo.toml
          cargo build --manifest-path membership-test/Cargo.toml
          cargo build --manifest-path join-test/Cargo.toml
          cargo build --manifest-path evict-test/Cargo.toml
          cargo build --manifest-path app-test/Cargo.toml
