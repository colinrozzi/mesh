[package]
name = "sm-smoke"
version = "0.1.0"
edition = "2021"
description = "Throwaway compose-smoke consumer: imports the RSM state-machine interface and calls through it, to prove packr composition of a state-machine importer + provider (sm-trivial). Not part of v0 — a step-1 de-risk."

[lib]
crate-type = ["cdylib"]

[dependencies]
packr-guest = "0.12.1"

[profile.release]
opt-level = "s"
lto = true
