[package]
name = "mesh-example-app"
version = "0.1.0"
edition = "2021"
description = "Example theater app actor that supervises a mesh node and talks to it over message-server."

[lib]
crate-type = ["cdylib"]

[dependencies]
mesh-api = { path = "../mesh-api" }
packr-guest = { version = "0.7.1", features = ["derive"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
