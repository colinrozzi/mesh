[package]
name = "sentinel-stub"
version = "0.1.0"
edition = "2021"
description = "A minimal sentinel-shaped ENTRY component for the mesh-client compose smoke: imports `mesh.submit` and re-exports it as `run`, so composing it with mesh-client-pkg exercises the cross-component call + the residual message-server-host host I/O."

[lib]
crate-type = ["cdylib"]

[dependencies]
packr-guest = "0.12.0"

[profile.release]
opt-level = "s"
lto = true
