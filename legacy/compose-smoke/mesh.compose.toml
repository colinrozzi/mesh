# Compose manifest for the mesh-client smoke: a sentinel-shaped entry composed
# with the mesh-client package. `mesh.submit` is linked to the package's export;
# `theater:simple/message-server-host.request` is intentionally left unlinked, so
# it survives as a residual import the theater host supplies at instantiate.
#
#   packr compose compose-smoke/mesh.compose.toml -o compose-smoke/composite.wasm

[[component]]
name = "sentinel"
wasm = "sentinel-stub/target/wasm32-unknown-unknown/release/sentinel_stub.wasm"
entry = true

[[component]]
name = "mesh-client"
wasm = "../mesh-client-pkg/target/wasm32-unknown-unknown/release/mesh_client_pkg.wasm"

[[link]]
consumer = "sentinel"
import = "mesh.submit"
provider = "mesh-client"
export = "submit"
