[package]
name = "sm-trivial"
version = "0.1.0"
edition = "2021"
description = "A trivial state-machine component exporting the RSM `state-machine` interface (see mesh state-machine.pact / DESIGN-rsm.md). Proves the SM side of the composition boundary and serves as the reference template for real SMs (control-SM, chat-SM)."

[lib]
crate-type = ["cdylib"]

[dependencies]
packr-guest = "0.12.7"

[profile.release]
opt-level = "s"
lto = true
