# Step-2 proof: compose the reshaped mesh node (entry, imports `state-machine`)
# with the trivial SM (provider, exports it). A green compose + host-only verify
# proves the node's SM import links to a provider and only theater host imports
# remain. Paths are relative to THIS manifest's directory.

[[component]]
name  = "mesh"
wasm  = "target/wasm32-unknown-unknown/release/mesh.wasm"
entry = true

[[component]]
name = "sm-trivial"
wasm = "sm-trivial/target/wasm32-unknown-unknown/release/sm_trivial.wasm"

[[link]]
consumer = "mesh"
import   = "state-machine.initial-state"
provider = "sm-trivial"
export   = "initial-state"

[[link]]
consumer = "mesh"
import   = "state-machine.validate"
provider = "sm-trivial"
export   = "validate"

[[link]]
consumer = "mesh"
import   = "state-machine.apply"
provider = "sm-trivial"
export   = "apply"

# NOTE: `state-machine.members` is declared in the node's pact (the interface hash
# covers all four) but DORMANT in admission-final v0 — never called, so wasm DCE
# drops the actual import and there is nothing to wire. It lights up (and gets a
# link here) when witness-based finality lands with the conflict-prone bundle.
